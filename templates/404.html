{% extends "base.html" %}

{% block title %}Page Not Found - FixMyCampus{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; text-align: center; padding: 4rem 1rem;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">🏛️ 404</div>
  <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.75rem;">
    Campus Page Not Found
  </h1>
  <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">
    The requested ticket, page, or campus report could not be found. It may have been relocated or closed.
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Return Home</a>
    <a href="{{ url_for('public_board') }}" class="btn btn-secondary btn-lg">Browse Public Board</a>
  </div>
</div>
{% endblock %}
