
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Create Staff Account | FixMyCampus</title>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

    <h1 class="text-3xl font-bold text-blue-700 text-center">
        FixMyCampus
    </h1>

    <h2 class="text-xl font-semibold text-center mt-4">
        Create Staff Account
    </h2>

    <p class="text-gray-500 text-center text-sm mt-2">
        Admin authorized registration
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="mt-4 p-3 rounded bg-blue-100 text-blue-800">
                {{ message }}
            </p>
        {% endfor %}
    {% endwith %}

    <form method="POST" class="mt-6 space-y-4">

        <input name="full_name"
               type="text"
               placeholder="Full Name"
               required
               class="w-full border rounded-lg p-3">

        <input name="mobile_number"
               type="tel"
               placeholder="10 Digit Mobile Number"
               pattern="[0-9]{10}"
               maxlength="10"
               required
               class="w-full border rounded-lg p-3">

        <select name="department"
                required
                class="w-full border rounded-lg p-3">

            <option value="">Select Department</option>
            <option value="Warden">Warden</option>
            <option value="Electrician">Electrician</option>
            <option value="Plumber">Plumber</option>
            <option value="Housekeeping">Housekeeping</option>
            <option value="IT Support">IT Support</option>
            <option value="Library In-charge">Library In-charge</option>
            <option value="Maintenance Head">Maintenance Head</option>
            <option value="Principal Office">Principal Office</option>

        </select>

        <input name="staff_code"
               type="password"
               placeholder="Create Staff Access Code"
               minlength="12"
               required
               class="w-full border rounded-lg p-3">

        <input name="confirm_code"
               type="password"
               placeholder="Confirm Staff Access Code"
               minlength="12"
               required
               class="w-full border rounded-lg p-3">

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-semibold">
            Create Staff Account
        </button>

    </form>

    <a href="{{ url_for('admin_dashboard') }}"
       class="block text-center mt-5 text-blue-600">
        Back to Admin Dashboard
    </a>

</div>

</body>
</html>
